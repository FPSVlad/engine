MEMORY {
    ZP:     start = $0000, size = $0100, type = rw, define = yes;
    RAM:    start = $0200, size = $0600, type = rw, define = yes;
    HEADER: start = $0000, size = $0010, file = %O, fill = yes;
    PRG0:   start = $8000, size = $4000, file = %O, fill = yes, fillval = $FF;
    PRG1:   start = $C000, size = $4000, file = %O, fill = yes, fillval = $FF;
    CHR:    start = $0000, size = $2000, file = %O, fill = yes, fillval = $00;
}

SEGMENTS {
    HEADER:   load = HEADER, type = ro;
    ZEROPAGE: load = ZP,     type = zp;
    BSS:      load = RAM,    type = bss, define = yes;

    CODE:     load = PRG1,   type = ro;
    RODATA:   load = PRG0,   type = ro;
    DATA:     load = PRG0,   run = RAM, type = rw, define = yes;
    VECTORS:  load = PRG1,   type = ro, start = $FFFA;
}
